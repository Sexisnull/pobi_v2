# 开发模式覆盖文件（docker-compose.override.yml）
# 与 docker-compose.yml 合并生效，仅用于本地开发：
#   - 挂载宿主机源码进容器（改了立即可见，无需重建镜像）
#   - api 启用 uvicorn --reload（文件变化自动重启 worker）
#   - worker 启用 arq --watch（监听源码变化自动重载）
# 生产部署请用 start-prod.sh（不加载本文件，或显式 -f docker-compose.yml）。
#
# 说明：
#   Docker 会自动加载同目录下的 docker-compose.override.yml，
#   所以直接 `docker compose up` 即进入 dev 模式；
#   生产用 `docker compose -f docker-compose.yml up -d` 可忽略本文件
#   （生产脚本 start-prod.sh 已显式指定 -f 隔离本文件）。

services:
  api:
    # 覆盖镜像为构建产物（保持依赖层 /opt/venv 不变）
    build:
      context: .
      dockerfile: Dockerfile.prod
    # 挂载宿主机源码，覆盖镜像内 /app（COPY 的那层被卷遮蔽）
    # 注意：compose 合并时本 volumes 会整体替换 base 的同名配置，
    # 因此必须显式补回 base 的 docker.sock 与 ~/.pobi / ~/.pobi_v2 映射，
    # 否则开发模式下 AVFS 报告/记忆不落本机、且跨重启丢失。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pobi_v2:/app/pobi_v2
      - ./pobi_agent:/app/pobi_agent
      - ./pobi_prompts:/app/pobi_prompts
      - ./alembic:/app/alembic
      - ~/.pobi_v2:/root/.pobi_v2
    # 开发期关闭自动重启，避免 reload 与 restart 策略打架
    restart: "no"
    # 启用热重载：文件变化 → uvicorn 自动重启 worker
    command: ["uvicorn", "pobi_v2.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pobi_v2:/app/pobi_v2
      - ./pobi_agent:/app/pobi_agent
      - ./pobi_prompts:/app/pobi_prompts
      - ./alembic:/app/alembic
      - ~/.pobi_v2:/root/.pobi_v2
    restart: "no"
    # 注意：开发期 **不** 使用 arq --watch。--watch 会监听 /app 下任何文件变更
    # 并发送 SIGUSR1 重启 worker，曾导致运行中的探针任务被 cancel、且重启后卡在
    # 启动初始化（如 avfs 挂载）不再刷 health-check 键，表现为 Worker 假活离线。
    # 改源码后请手动 `docker compose restart worker` 生效，而非依赖自动重载。
    # 同理，api 的 uvicorn --reload 仅热重载 API 进程，不会触发 arq worker 重载。
    command: ["arq", "pobi_v2.engine.worker.WorkerSettings"]

  web:
    # 开发模式：用关闭静态缓存的 nginx 配置覆盖生产版
    # （生产 nginx.conf 有 /static/ expires 1d，浏览器强缓存导致改 JS 不生效）
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
