# Pobi v2 生产编排（一键本地构建 / 远端 pull 发布）
# ---------------------------------------------------------------------------
# 两种发布模式：
#   1. 本地构建（默认）：ACR_REGISTRY / POBI_IMAGE 均留空时，api/worker 使用本地
#      build 上下文（Dockerfile.prod）构建 pobi_v2:1.0.0，无需外部仓库。
#   2. 远端 pull（推荐给他人）：设置 POBI_IMAGE 指向已推送的全量镜像，例如
#      crpi-9ztkvcvf31ip1h4c.cn-hangzhou.personal.cr.aliyuncs.com/pobi/pobi_v2:1.0.0
#      执行 ./start-prod.sh 将优先 `docker compose pull` 该镜像，避免本地构建网络失败；
#      pull 失败时回退到本地 build（离线/自建仓仍可用）。
#      publish-image.sh 可一键登录 ACR 并推送全量镜像。
#
# 全面容器化：所有组件接入统一网络 pobi_net；Kali 沙箱为常驻单实例容器，
# api/worker 经 Docker-out-of-Docker（挂载 /var/run/docker.sock）复用宿主机
# Docker daemon 以连接该 Kali 容器，shell 命令与 Python 验证共用同一容器。
# Kali「对外访问」指容器内 agent 主动向外发起扫描/请求（出站），无需暴露入站端口。

services:
  postgres:
    image: ${ACR_REGISTRY:-}postgres:16-alpine
    environment:
      POSTGRES_USER: ${POBI_V2_DB_USER:-pobi}
      POSTGRES_PASSWORD: ${POBI_V2_DB_PASSWORD:-pobi}
      POSTGRES_DB: ${POBI_V2_DB_NAME:-pobi_v2}
    # 仅内部网络直连，不映射宿主端口（安全收敛）
    volumes:
      - pobi_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POBI_V2_DB_USER:-pobi}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pobi_net
    restart: unless-stopped

  redis:
    image: ${ACR_REGISTRY:-}redis:7-alpine
    # 仅内部网络直连，不映射宿主端口（安全收敛）
    volumes:
      - pobi_v2_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pobi_net
    restart: unless-stopped

  # ---- Kali 沙箱（全局共享单实例）----
  # 常驻容器，所有 shell 攻击命令与 Python 验证脚本共用同一容器。
  # 生命周期随 compose；api/worker 经 DooD 连接 pobi_kali（容器名固定）。
  kali:
    image: ${KALI_IMAGE:-${ACR_REGISTRY:-}xoxruns/sandboxed_kali:latest}
    container_name: pobi_kali
    command: ["/bin/bash"]
    stdin_open: true
    tty: true
    # 暴露容器内的工具链服务（如 sqlmap/nmap 需要对外回调时可在此映射）
    networks:
      - pobi_net
    # 健康检查：容器可响应基础命令即视为就绪
    healthcheck:
      test: ["CMD", "bash", "-c", "echo kali_ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---- API（FastAPI + gunicorn/uvicorn）----
  api:
    image: ${POBI_IMAGE:-${ACR_REGISTRY:-pobi_v2}:1.0.0}
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      POBI_V2_DATABASE_URL: postgresql+psycopg://${POBI_V2_DB_USER:-pobi}:${POBI_V2_DB_PASSWORD:-pobi}@postgres:5432/${POBI_V2_DB_NAME:-pobi_v2}
      POBI_V2_REDIS_URL: redis://redis:6379/0
      POBI_V2_EVENT_BUS_BACKEND: redis
      POBI_V2_SANDBOX_IMAGE: ${KALI_IMAGE:-${ACR_REGISTRY:-}xoxruns/sandboxed_kali:latest}
      POBI_V2_SANDBOX_NETWORK: pobi_net
      POBI_V2_KALI_CONTAINER_NAME: pobi_kali
      # 持久化根目录：容器内 Path.home()=/root，统一落盘到 /root/.pobi_v2，
      # 与宿主 ~/.pobi_v2 挂载对齐（ContextEngine 等产物落盘且跨重启保留）。
      POBI_HOME: /root/.pobi_v2
      POBI_CACHE_HOME: /root/.pobi_v2/cache
    # DooD：挂载宿主机 docker.sock，使容器内 docker.from_env() 可管理 Kali 容器
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主 AVFS 存储映射：agent 报告/记忆/ContextEngine 等均写入 /root/.pobi_v2
      # （由 POBI_HOME 指定），挂回宿主 ~/.pobi_v2 保证落盘到本机且跨容器重启保留。
      - ~/.pobi_v2:/root/.pobi_v2
      # 应用日志持久化：容器内 /app/logs/{api,worker}.log 映射回宿主 ./logs，
      # 使 docker compose logs 之外也能在宿主直接查阅统一格式的运行日志。
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kali:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - pobi_net
    restart: unless-stopped

  # ---- Worker（ARQ 异步任务执行）----
  # 多任务并行：ARQ 队列在 Redis，天然支持多 Worker 进程从同一队列竞争消费。
  # 提升并发两种方式（可叠加）：
  #   1) 进程内并发：worker.py 的 max_jobs（POBI_V2_WORKER_MAX_JOBS，默认 2）。
  #      因共享 Kali 沙箱为单容器，进程内并发过大会互相争抢 shell/python。
  #   2) 多 Worker 副本（推荐主路径）：本服务起 N 个副本，每个独立进程事件循环，
  #      LLM 调度真正并行；共享沙箱仅作验证用（授权已按 task_id 隔离）。
  #      设置方式二选一：
  #        a. 设 POBI_V2_WORKER_REPLICAS 后 `docker compose up -d`（deploy.replicas）。
  #        b. 或 `docker compose up -d --scale worker=N`（无需改 env）。
  worker:
    image: ${POBI_IMAGE:-${ACR_REGISTRY:-pobi_v2}:1.0.0}
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    command: ["arq", "pobi_v2.engine.worker.WorkerSettings"]
    # 多 Worker 副本（方案 B）：默认 1；设为 N 即起 N 个竞争消费进程。
    # 注意：本服务未设 container_name，满足 --scale 要求。
    deploy:
      replicas: ${POBI_V2_WORKER_REPLICAS:-1}
    environment:
      POBI_V2_DATABASE_URL: postgresql+psycopg://${POBI_V2_DB_USER:-pobi}:${POBI_V2_DB_PASSWORD:-pobi}@postgres:5432/${POBI_V2_DB_NAME:-pobi_v2}
      POBI_V2_REDIS_URL: redis://redis:6379/0
      POBI_V2_EVENT_BUS_BACKEND: redis
      POBI_V2_SANDBOX_IMAGE: ${KALI_IMAGE:-${ACR_REGISTRY:-}xoxruns/sandboxed_kali:latest}
      POBI_V2_SANDBOX_NETWORK: pobi_net
      POBI_V2_KALI_CONTAINER_NAME: pobi_kali
      # 持久化根目录：与 api 一致，统一落盘到 /root/.pobi_v2。
      POBI_HOME: /root/.pobi_v2
      POBI_CACHE_HOME: /root/.pobi_v2/cache
    # DooD：挂载宿主机 docker.sock，使容器内 docker.from_env() 可管理 Kali 容器
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主 AVFS 存储映射：与 api 一致，保证 worker 落盘到本机 ~/.pobi_v2
      - ~/.pobi_v2:/root/.pobi_v2
      # 应用日志持久化：与 api 一致，容器内 /app/logs 映射回宿主 ./logs
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kali:
        condition: service_healthy
    # worker 跑 arq（非 uvicorn），无 HTTP 端口；覆盖镜像默认的 /health 探活。
    # 容器内无 ps/pgrep/redis-cli，改用 python 检查：Redis 可达 且 arq 已在 Redis
    # 注册（存在 arq: 前缀键，如 arq:queue:health-check），即可判定 worker 健康。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,sys; r=redis.Redis(host='redis',port=6379,socket_timeout=3); r.ping(); sys.exit(0 if r.keys('arq:*') else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pobi_net
    restart: unless-stopped

  # ---- Web（nginx 静态托管 + 反代 + Gzip）----
  web:
    image: ${ACR_REGISTRY:-nginx}:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - pobi_net
    restart: unless-stopped

networks:
  pobi_net:
    driver: bridge
    name: pobi_net

volumes:
  pobi_v2_pg:
  pobi_v2_redis:
