# 开发模式 nginx 配置（覆盖生产 nginx.conf）
# 与 docker-compose.override.yml 配合使用，仅用于本地开发：
#   - /static/ 关闭强缓存（no-cache），改了 JS/CSS 浏览器立即拉新
#   - 其余反代逻辑与生产一致（/api/ -> api:8000，SSE 长连接）
# 生产用 nginx.conf（start-prod.sh 不加载 override，自然走生产配置）。
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---- 静态前端（开发模式：禁用缓存，改完即时生效）----
        location /static/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ---- API 反代 ----
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- SSE 实时流（仅匹配 /api/v1/tasks/{id}/stream，避免吞噬列表端点）----
        location ~ ^/api/v1/tasks/[^/]+/stream$ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ---- SPA fallback：未知路径返回 index.html ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
