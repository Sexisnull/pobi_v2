# 开发模式 nginx 配置（覆盖生产 nginx.conf）
# 与 docker-compose.override.yml 配合使用，仅用于本地开发：
#   - 前端为 React 构建产物（web/spa），根目录直接静态托管，/ 即控制台
#   - 其余反代逻辑与生产一致（/api/ -> api:8000，SSE 长连接）
# 生产用 nginx.conf（start-prod.sh 不加载 override，自然走生产配置）。
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker 内嵌 DNS。必须配合变量形式的 proxy_pass 使用：
    # 开源版 nginx 对 upstream block 内的域名只在启动时解析一次并永久缓存，
    # api 容器重启后 IP 漂移会导致 nginx 仍连旧地址（撞到其他容器）而返回 502。
    # 改用变量 + resolver 后，nginx 按 valid 周期重新解析，IP 变化可自动跟随。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 升级连接映射（供 /app 与 SSE 长连接使用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 变量形式持有后端地址，使 proxy_pass 走 resolver 动态解析（见 http 块注释）。
        # 注意不可写为 http://$api_upstream/ （带尾斜杠会吞掉原始 URI）。
        set $api_upstream "api:8000";

        # ---- API 反代 ----
        location /api/ {
            proxy_pass         http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- React 前端（web/spa，由 FastAPI /app 路由托管）----
        # 必须放在 location / 之前：前缀匹配 /app/ 优先于 /，否则会被 try_files 拦截。
        location /app/ {
            proxy_pass         http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        # ---- SSE 实时流（仅匹配 /api/v1/tasks/{id}/stream，避免吞噬列表端点）----
        location ~ ^/api/v1/tasks/[^/]+/stream$ {
            proxy_pass         http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ---- SPA fallback：未知路径返回 index.html ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
